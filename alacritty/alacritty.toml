[window]
decorations = "None" # or "none" for straight boxy
# decorations = "Buttonless"
# padding = { x = 3, y = 0 }
# dynamic_padding = true

[font]
# normal = { family = "FixedMedium 6x13" }
normal = { family = "Consolas NF" }
#normal = { family = "Windows Command Prompt" }
#normal = { family = "JetBrainsMono NF" }
size = 15.0


[keyboard]
bindings = [
  { key = "Enter", mods = "Shift", chars = "\r" }
]

[cursor]
style = { shape = "block", blinking = "Always" }
thickness = 0.8

# Windows 95 Color Scheme
# To have the authentic experience in Chicago95 GTK Theme.

# Default colors
[colors.primary]
background = '#000000'
foreground = '#C0C7C8'

# Normal colors
[colors.normal]
black   = '#000000'
red     = '#A80000'
green   = '#00A800'
yellow  = '#A85400'
blue    = '#0000A8'
magenta = '#A800A8'
cyan    = '#00A8A8'
white   = '#A8A8A8'

# Bright colors
[colors.bright]
black   = '#545454'
red     = '#FC5454'
green   = '#54FC54'
yellow  = '#FCFC54'
blue    = '#5454FC'
magenta = '#FC54FC'
cyan    = '#54FCFC'
white   = '#FFFFFF'

#[[keyboard.bindings]]
#key = "Return"
#mods = "Shift"
#chars = "\u001B\r"
